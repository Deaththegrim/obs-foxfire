name: Linux render proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS (PPA) and tools
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio xvfb cmake ninja-build pkg-config build-essential \
            python3-websockets python3-pil python3-numpy python3-cryptography mesa-utils libsimde-dev \
            libcurl4-openssl-dev ffmpeg
          # ffmpeg is the BINARY, for alert-proof.py's audio_rms. It is not the same thing as OBS's
          # built-in `ffmpeg_source` input kind that the other proofs use, which needs nothing
          # installed -- which is why its absence went unnoticed until the alert proof was added.
      - name: Are the private packs checked out? 🔎
        id: packs
        # hashFiles() CANNOT be used for this: it refuses any path outside the workspace and
        # errors the whole job ("Fail to hash files under directory /home/runner/work/..."),
        # which is how every pack-dependent gate below was written. They therefore never ran
        # once -- earlier in a run the job had already failed before the expression was
        # evaluated, and the moment everything above went green the expression itself became
        # the failure. A shell test can look wherever it likes.
        run: |
          have() { [ -f "$1" ] && echo "true" || echo "false"; }
          {
            echo "basics=$(have ../foxfire/packs/basics/pack.json)"
            echo "shaders=$(have ../foxfire/packs/basics/effects/bars.effect)"
            echo "mouth=$(have ../foxfire/packs/mouth/pack.json)"
            echo "mouth_art=$(have ../foxfire/packs/mouth/art/mouth-strip.png)"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake --preset ubuntu-x86_64 -DFOXFIRE_BUILD_TESTS=ON
          cmake --build --preset ubuntu-x86_64
      - name: Unit tests
        run: ctest --test-dir build_x86_64 --output-on-failure
      - name: Licence interop gate (must run, not skip)
        # ctest counts a skip as a pass, and this is the only check that Python-signed
        # licences verify in C. Run it directly so a missing cryptography module exits
        # 77 and fails the job instead of quietly reporting green.
        run: python3 tools/licence-interop.py build_x86_64/tests/verify_cli
      - name: Render proof (software GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/proof.py --plugin-build . --pack data/packs/demo --out proof-out
      - name: Viewer-supplied art + named dropdowns
        # Neither is covered by the render proof above: both are about CONTROLS, and a pack
        # renders identically whether or not the viewer can reach them.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/user-image-proof.py --plugin-build .
      - name: Gradients
        # The one parameter type where "the property appeared" and "the picture changed" can
        # come apart: the colour pickers can be present and correct while nothing is bound.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/gradient-proof.py --plugin-build .
      - name: Each plugin loads, and loads on its own
        # Foxfire ships as separate plugins so nobody has to install all of it. "Installable on
        # its own" is a claim, and a plugin that builds but never loads looks identical in a
        # build log -- so this boots OBS three times: both installed, each one alone.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/plugin-split-proof.py
      - name: Alerts draw a name and make a sound
        # The two things the layer renderer has never done. The sound half measures a real
        # RECORDING, not a meter: libobs refuses OBS_SOURCE_AUDIO on a composite source, so
        # obs-websocket's meters are blind to it by construction.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/alert-proof.py --plugin-build .
      - name: The transition actually transitions
        id: transition
        # A transition exists only DURING a cut, so nothing else in this job can see it: an idle
        # screenshot shows a scene, and GetSourceScreenshot cannot address a transition by name at
        # all. This drives a real cut and reads the program RECORDING -- and the audio half is the
        # point, because libobs does not mix the two scenes for us and a transition that forgets
        # audio_render makes the scene SILENT for its whole duration with nothing visibly wrong.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        # --allow-skips ONLY when the private packs repo is absent. With it checked out the two
        # pack-driven halves (the mask wipe's shape, the covering sweep's cover) must actually
        # run: they used to skip and still exit 0 behind a "9/9 passed" line.
        run: |
          if [ "${{ steps.packs.outputs.basics }}" = "true" ]; then
            python3 tools/transition-proof.py --plugin-build .
          else
            python3 tools/transition-proof.py --plugin-build . --allow-skips
          fi

      - name: Every source exposes its live meters
        id: tap
        # The per-source proc handlers (ff-props.c) are how anything outside an instance reaches
        # its analysis -- a dock, an obs-websocket script, another plugin -- without the plugin
        # growing a global registry of live instances. They are the first proc handler in this
        # project, and nothing else in this job can see them: the unit tests cannot build an
        # instance (ff_instance_create needs a graphics context) and obs-websocket has no generic
        # "call this proc" request. So the plugin checks itself on a real source in a real OBS and
        # this reads the verdict out of the log. NOT gated on Qt -- proc handlers are bare libobs,
        # so this runs in the default build.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/dock-proof.py --plugin-build .

      - name: The shared pack control block has not drifted
        id: placement
        # Static, so it needs no display. OBS's effect language has no #include, so the
        # Placement/Response block is COPIED into every shader that wants it; this refuses a
        # control declared two different ways, and a helper that is defined and never called --
        # both of which compile, render, and pass every pixel gate above.
        #
        # Conditional because the packs live in a PRIVATE repo that is not checked out here. A
        # step that always fails teaches everyone to ignore a red job, and a step that silently
        # passes on nothing inspected is worse -- so check-placement.py itself exits 2 when it
        # finds no shaders, and this only runs when the packs are actually present.
        if: steps.packs.outputs.shaders == 'true'
        run: tools/check-placement.py ../foxfire/packs

      - name: Mouth art is registered
        id: mouth_art_gate
        # Every cell of a mouth strip must sit on the same anchor: the engine swaps them frame to
        # frame, so drift reads as the mouth sliding around the face while the character talks.
        # No renderer is involved, which is why this runs before anything boots OBS -- and it is
        # the one gate that will still matter when the art is redrawn, because generated art
        # (six image generations, or frames pulled out of a video model) is exactly where the
        # drift comes from.
        if: steps.packs.outputs.mouth_art == 'true'
        run: |
          python3 ../foxfire/tools/check-mouth-strip.py ../foxfire/packs/mouth/art/mouth-strip.png
          python3 ../foxfire/tools/check-mouth-strip.py ../foxfire/packs/mouth/art/mouth-strip-ink.png
          # the picker and the aligner against an animation whose right answer is known by
          # construction -- and --mutate, so a selftest that has stopped being able to fail
          # reports that rather than a pass
          python3 ../foxfire/tools/pick-mouth-frames.py --selftest
          python3 ../foxfire/tools/pick-mouth-frames.py --mutate

      - name: Pack controls actually move the picture
        id: controls
        # A control that exists in the properties panel and changes nothing is this project's
        # most common defect, and no "does it render" check can see it. Skipped when the packs
        # repo is not checked out beside this one -- it is private.
        if: steps.packs.outputs.basics == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/placement-proof.py --plugin-build . --pack ../foxfire/packs/basics

      - name: Every shipped pack renders
        id: packs_render
        # The gap that let a broken shader ship: alert-proof.py builds its OWN minimal pack, so
        # the real packs were never rendered by anything in CI. card.effect spent a while calling
        # a function it no longer had -- "error: opacity undeclared", the card layer drawing
        # nothing -- and every gate here was green. packforge's proof fails on a plugin warning,
        # which is what catches a shader that does not compile; it simply was not being run.
        #
        # Conditional, because the packs are in a private repo checked out beside this one.
        #
        # ember used to be left out here, with a comment saying its shaders were "covered by the
        # pack repo's own run". There is no such run -- that repo has no CI at all -- so the only
        # PAID pack in the product was the one thing nothing rendered. It was excluded because a
        # licensed pack needs a licence.json verified against FF_PUBLIC_KEY and every CI build has
        # an all-zero key, so it came back 7 of 7 blank. packforge now proves a throwaway
        # unlicensed COPY of such a pack (packforge/proof.py::_renderable_copy) and says so in the
        # log; the licence gate keeps its own tests.
        #
        # The list is read off disk, not written here. A hardcoded list silently gives a NEW pack
        # zero coverage: `kitsune-transitions` was added with 18 presets, two shaders and 19 art
        # files, and this step did not know it existed.
        #
        # A pack whose presets are ALL transitions is skipped here and gated by the next step
        # instead -- `packforge proof` marks a transition preset "proved elsewhere" and correctly
        # refuses a run that inspected nothing, so running it over such a pack is a guaranteed
        # exit 1 that says nothing about the pack.
        if: steps.packs.outputs.basics == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: ../foxfire
        run: |
          set -euo pipefail
          kinds() { python3 -c "import json,sys;print(' '.join(sorted({p['kind'] for p in json.load(open(sys.argv[1]))['presets']})))" "$1"; }
          n=0
          for man in packs/*/pack.json; do
            pack="$(dirname "$man")"
            if [ "$(kinds "$man")" = "transition" ]; then
              echo "skipping $pack: transition-only, gated by the next step"
              continue
            fi
            echo "::group::$pack"
            python3 -m packforge proof --no-thumbs --engine "$GITHUB_WORKSPACE" "$pack"
            echo "::endgroup::"
            n=$((n + 1))
          done
          echo "rendered $n pack(s)"
          # A glob that matched nothing would leave every pack unrendered and the loop green.
          [ "$n" -gt 0 ] || { echo "no pack was rendered -- that is not a pass"; exit 1; }

      - name: Every transition preset of every pack actually draws
        id: transitions_render
        # `packforge proof` cannot see a transition: it marks one "proved elsewhere" because a
        # transition renders nothing in a still, existing only during a cut. transition-proof.py
        # then drives exactly THREE hardwired presets. So every other transition in the product --
        # all 18 of kitsune-transitions, and 11 of basics -- was gated by nothing at all.
        #
        # This drives every one of them through a real OBS and judges the recorded frames. See
        # tools/preview-transitions.py::gate for what the two checks per preset catch and why.
        if: steps.packs.outputs.basics == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          has_transition() { python3 -c "import json,sys;sys.exit(0 if any(p['kind']=='transition' for p in json.load(open(sys.argv[1]))['presets']) else 1)" "$1"; }
          n=0
          for man in ../foxfire/packs/*/pack.json; do
            pack="$(dirname "$man")"
            has_transition "$man" || continue
            echo "::group::$(basename "$pack")"
            python3 tools/preview-transitions.py --plugin-build . --pack "$pack" \
              --out "preview-out/$(basename "$pack")" --gate
            echo "::endgroup::"
            n=$((n + 1))
          done
          echo "gated $n pack(s) with transition presets"
          [ "$n" -gt 0 ] || { echo "no transition pack was gated -- that is not a pass"; exit 1; }

      - name: Keep the transition previews
        if: always() && steps.transitions_render.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: transition-previews
          path: preview-out/
          if-no-files-found: ignore

      - name: The mouth draws the shape the audio asked for
        id: mouth_render
        # Every layer under this is tested alone -- the classifier against synthesised vowels, the
        # band layout, the hold timing. None of it shows that the number reaches the shader or
        # that the shader picks the cell the number names, and a mouth stuck on one shape renders
        # perfectly well. The placeholder strip gives each shape its own hue so a screenshot can
        # say WHICH cell was drawn.
        if: steps.packs.outputs.mouth == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/mouth-proof.py --plugin-build . --pack ../foxfire/packs/mouth

      - name: Say what each pack gate actually did
        # A green job must not mean two different things, and this step kept finding new
        # ways to mean the wrong one. It used to sit in the MIDDLE of the gate list, so
        # "every pack-dependent gate ran" was written before four of them had, and when
        # check-placement itself failed it announced "the job FAILED before the pack
        # gates" -- pointing the reader away from the pack gate that had just failed. It
        # also re-derived pack presence from `-d ../foxfire/packs` while the gates keyed
        # off four per-file probes, so a missing packs/mouth/ read as "all present".
        #
        # It now runs LAST and reports each gate's own recorded outcome. No derivation,
        # no prose claim about steps it cannot see.
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          O_PLACEMENT: ${{ steps.placement.outcome }}
          O_MOUTH_ART: ${{ steps.mouth_art_gate.outcome }}
          O_CONTROLS: ${{ steps.controls.outcome }}
          O_PACKS_RENDER: ${{ steps.packs_render.outcome }}
          O_MOUTH_RENDER: ${{ steps.mouth_render.outcome }}
        run: |
          {
            echo "### Pack-dependent gates"
            echo ""
            echo "| gate | outcome |"
            echo "|------|---------|"
            echo "| check-placement (shared control block) | ${O_PLACEMENT:-not reached} |"
            echo "| mouth strip registration + picker selftest | ${O_MOUTH_ART:-not reached} |"
            echo "| pack controls move the picture | ${O_CONTROLS:-not reached} |"
            echo "| every shipped pack renders | ${O_PACKS_RENDER:-not reached} |"
            echo "| the mouth draws the shape asked for | ${O_MOUTH_RENDER:-not reached} |"
            echo ""
            echo "\`skipped\` means the private foxfire packs repo is not checked out beside"
            echo "this one, so the gate had nothing to inspect. \`not reached\` means the job"
            echo "stopped before it. **Neither is a pass.**"
            echo ""
            case "$JOB_STATUS" in
              success)   echo "Job status: success." ;;
              failure)   echo "Job status: FAILURE — read the failing step. If it is one of the rows above, it is a pack gate that ran and failed, not a job that died before them." ;;
              cancelled) echo "Job status: CANCELLED — gates below the cancellation point did not run, and that is why, whatever the packs are doing." ;;
              *)         echo "Job status: $JOB_STATUS." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ github.sha }}
          path: proof-out
