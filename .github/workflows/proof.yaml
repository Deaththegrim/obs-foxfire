name: Linux render proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS (PPA) and tools
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio xvfb cmake ninja-build pkg-config build-essential \
            python3-websockets python3-pil python3-numpy python3-cryptography mesa-utils libsimde-dev
      - name: Build
        run: |
          cmake --preset ubuntu-x86_64 -DFOXFIRE_BUILD_TESTS=ON
          cmake --build --preset ubuntu-x86_64
      - name: Unit tests
        run: ctest --test-dir build_x86_64 --output-on-failure
      - name: Licence interop gate (must run, not skip)
        # ctest counts a skip as a pass, and this is the only check that Python-signed
        # licences verify in C. Run it directly so a missing cryptography module exits
        # 77 and fails the job instead of quietly reporting green.
        run: python3 tools/licence-interop.py build_x86_64/tests/verify_cli
      - name: Render proof (software GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/proof.py --plugin-build . --pack data/packs/demo --out proof-out
      - name: Viewer-supplied art + named dropdowns
        # Neither is covered by the render proof above: both are about CONTROLS, and a pack
        # renders identically whether or not the viewer can reach them.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/user-image-proof.py --plugin-build .
      - name: Gradients
        # The one parameter type where "the property appeared" and "the picture changed" can
        # come apart: the colour pickers can be present and correct while nothing is bound.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/gradient-proof.py --plugin-build .
      - name: Each plugin loads, and loads on its own
        # Foxfire ships as separate plugins so nobody has to install all of it. "Installable on
        # its own" is a claim, and a plugin that builds but never loads looks identical in a
        # build log -- so this boots OBS three times: both installed, each one alone.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/plugin-split-proof.py
      - name: Alerts draw a name and make a sound
        # The two things the layer renderer has never done. The sound half measures a real
        # RECORDING, not a meter: libobs refuses OBS_SOURCE_AUDIO on a composite source, so
        # obs-websocket's meters are blind to it by construction.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/alert-proof.py --plugin-build .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ github.sha }}
          path: proof-out
